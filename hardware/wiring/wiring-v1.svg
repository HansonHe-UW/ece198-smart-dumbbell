<text x='20' y='730' font-size='11' text-anchor='start' font-weight='bold' fill='#111' font-family='Helvetica, Arial, sans-serif'>Legend: dot = connection. Lines crossing without a dot are not connected. Dashed = optional.</text>
<text x='20' y='748' font-size='11' text-anchor='start' font-weight='normal' fill='#111' font-family='Helvetica, Arial, sans-serif'>Pull-ups: the 4517 carries 10 k to 3.3 V on SDA/SCL and the OLED module usually carries its own. The GY-MAX30102 often ties 4.7 k to its 1.8 V rail,</text>
<text x='20' y='762' font-size='11' text-anchor='start' font-weight='normal' fill='#111' font-family='Helvetica, Arial, sans-serif'>which drags the bus high level to roughly 2.7 V. Measure SDA/SCL high level after assembly; if below 2.5 V, move the MAX30102 pull-ups to 3.3 V or remove them.</text>
<text x='20' y='780' font-size='11' text-anchor='start' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif'>Not drawn: the course R4 Minima and breadboard (bench only), the ADXL335 backup, the Dragino Yun Shield (not used).</text>
<text x='20' y='798' font-size='11' text-anchor='start' font-weight='normal' fill='#555' font-family='Helvetica, Arial, sans-serif'>D9 is reserved for LSM6DSOX INT1 and is not wired in v1. Pin assignment is a proposal. Record the final assignment in firmware/ once the first integration sketch runs.</text>
</svg>
